const sizes=[...Array(27).fill(11),12,12,12];
const days=[];let p=0;sizes.forEach(s=>{days.push([p,p+s]);p+=s});
const hues=[262,330,38,160,200,12,285,95,350,175,225,50];
const col=i=>`hsl(${hues[i%12]} 70% 46%)`;
let known={};try{known=JSON.parse(localStorage.getItem('b333')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('b333',JSON.stringify(known))}catch(e){}};
let cur=0,mode='cards';
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(w,s){const stem=w.slice(0,Math.max(3,w.length-3));return esc(s).replace(new RegExp('\\b('+stem.replace(/[^a-z]/gi,'')+'\\w*)','i'),'<mark>$1</mark>')}
const dayDone=d=>{for(let i=days[d][0];i<days[d][1];i++)if(!known[i])return false;return true};
function refreshTop(){const n=Object.keys(known).filter(k=>known[k]).length;$('pb').style.width=n/333*100+'%';$('st').textContent=n+' / 333 words known';
$('days').innerHTML=days.map((_,d)=>`<button class="d ${d==cur?'on':''} ${dayDone(d)?'done':''}" onclick="go(${d})">${d+1}</button>`).join('')}
function go(d){cur=d;mode='cards';render()}
function render(){refreshTop();mode=='cards'?cards():quizView()}
function cards(){const [a,b]=days[cur];let h=`<div class="head"><h2>Day ${cur+1} · words ${a+1}–${b}</h2><div><button class="btn" onclick="startQuiz([${[...Array(b-a).keys()].map(i=>a+i)}],'Day ${cur+1} quiz')">Play day quiz</button> <button class="btn alt" onclick="review()">Review mix</button></div></div><div class="grid">`;
for(let i=a;i<b;i++){const [w,d,e,x]=W[i];h+=`<div class="card ${known[i]?'k':''}" style="--c:${col(i-a)}" id="c${i}" onclick="this.classList.toggle('flip')"><div class="in"><div class="f"><span class="n">#${i+1}</span><div class="w">${w}</div><div class="t">tap to flip ↻</div></div><div class="b"><h3>${w}</h3><div><div class="lab">MEANING</div>${esc(d)}</div><div class="easy">💡 Think: ${esc(e)}</div><div><div class="lab">EXAMPLE</div><div class="ex">${hl(w,x)}</div></div><button class="kb" onclick="event.stopPropagation();tg(${i})">${known[i]?'✓ I know this':'Mark as known'}</button></div></div></div>`}
$('main').innerHTML=h+'</div>'}
function tg(i){known[i]=!known[i];save();const c=$('c'+i);c.classList.toggle('k',!!known[i]);c.querySelector('.kb').textContent=known[i]?'✓ I know this':'Mark as known';refreshTop()}
function review(){const pool=[];for(let i=0;i<days[cur][1];i++)pool.push(i);const pick=pool.sort(()=>Math.random()-.5).slice(0,12);startQuiz(pick,'Review mix')}
let Q=[],qi=0,sc=0,qTitle='';
function startQuiz(ids,t){Q=ids.slice().sort(()=>Math.random()-.5);qi=0;sc=0;qTitle=t;mode='quiz';render()}
function quizView(){if(qi>=Q.length){$('main').innerHTML=`<div class="quiz"><h2>${qTitle} done 🎉</h2><p class="q">Score: ${sc} / ${Q.length}</p><button class="btn" onclick="go(cur)">Back to cards</button> <button class="btn alt" onclick="startQuiz(Q,qTitle)">Retry</button></div>`;return}
const i=Q[qi],a=W[i];const alt=new Set([i]);while(alt.size<4)alt.add(Math.floor(Math.random()*333));
const o=[...alt].sort(()=>Math.random()-.5);
$('main').innerHTML=`<div class="quiz"><div class="lab">${qTitle} · ${qi+1}/${Q.length}</div><div class="q">Which word means “${esc(a[2])}”?</div><div class="ex" style="color:var(--mut)">${esc(a[3].replace(new RegExp('\\b'+a[0].slice(0,Math.max(3,a[0].length-3))+'\\w*','i'),'_____'))}</div>${o.map(k=>`<button class="opt" onclick="ans(this,${k},${i})">${W[k][0]}</button>`).join('')}</div>`}
function ans(el,k,i){if(el.parentNode.dataset.d)return;el.parentNode.dataset.d=1;const ok=k==i;if(ok)sc++;el.classList.add(ok?'ok':'no');
[...el.parentNode.querySelectorAll('.opt')].forEach(b=>{if(b.textContent==W[i][0])b.classList.add('ok')});
el.parentNode.insertAdjacentHTML('beforeend',`<p><b>${W[i][0]}</b> — ${esc(W[i][1])}</p><button class="btn" onclick="qi++;render()">Next →</button>`)}
render();
</script></body></html>
